# Builds the seed-phone app's release APK on every push to main (and on demand).
# Download it from the run's "Artifacts" section on the Actions tab.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Licences accepted here; Gradle downloads the exact platform / build-tools React Native asks for
      # (compileSdk 37, build-tools 37.0.0) itself, under the SDK's own package names.
      - name: Android SDK (licences)
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install JS dependencies
        run: npm ci

      - name: JS checks
        run: |
          npx tsc --noEmit
          npx jest --ci

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spam-check-app-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
